<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<title>Cisat Lab – Peminjaman Alat Laboratorium</title>

<style>
:root{--o:#f26a0f;--o2:#ff8a3d;--bg:#fdf4ec;--card:#fff;--tx:#2b2018;--mu:#85766b;--bd:#f3e6da;--sh:0 2px 10px #f26a0f14;--ok:#16a34a;--okb:#dcf5e5;--bl:#2563eb;--blb:#dbe8ff;--rd:#dc2626;--rdb:#fde2e2;--yl:#b45309;--ylb:#fff0e0;--tile:#fdeedd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#17110d;--card:#241c16;--tx:#f5ece4;--mu:#b3a497;--bd:#382d24;--sh:none;--okb:#173a27;--blb:#1c2f57;--rdb:#4a1f1f;--ylb:#4a3018;--tile:#3a2c20}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:84px}
.i{flex:none;vertical-align:middle}
.top{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;padding:16px 16px 20px;border-radius:0 0 22px 22px}
.top .at{position:absolute;right:-10px;top:-8px;width:130px;height:130px;opacity:.18;pointer-events:none}
.tr{display:flex;align-items:center;gap:8px;position:relative}.top h2{margin:0;font-size:19px;font-weight:700}.top small{opacity:.92;display:block;margin-top:2px}
.ib{border:0;background:#ffffff2e;color:#fff;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib i{position:absolute;top:-3px;right:-3px;background:#dc2626;color:#fff;font:700 10px Inter,system-ui;border-radius:99px;padding:1px 5px;font-style:normal}
.ib.bk{background:none;width:30px;margin-left:-6px}
.pad{padding:14px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .card{margin:0}
.stat{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px}.stat span{color:var(--mu);font-size:12px;display:block}.stat b{display:block;font-size:26px;line-height:1.2}.stat>svg{color:var(--o)}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.ico{width:52px;height:52px;border-radius:12px;background:var(--tile);display:grid;place-items:center;flex:none;overflow:hidden}.ico svg{width:86%;height:86%}.ico img{width:100%;height:100%;object-fit:cover}
.av{width:54px;height:54px;border-radius:50%;background:var(--tile);color:var(--o);display:grid;place-items:center;flex:none}
.tag{font-size:11px;padding:2px 10px;border-radius:99px;font-weight:600;white-space:nowrap;display:inline-block}
.g{background:var(--okb);color:var(--ok)}.b{background:var(--blb);color:var(--bl)}.r{background:var(--rdb);color:var(--rd)}.y{background:var(--ylb);color:var(--yl)}.n{background:var(--bd);color:var(--mu)}
.mu{color:var(--mu);font-size:12px}h3{margin:14px 0 8px;font-size:15px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:12px}
label{font-size:13px;font-weight:600;color:var(--tx);display:block;margin-bottom:6px}
.sr{position:relative}.sr svg{position:absolute;left:12px;top:12px;color:var(--mu)}.sr input{padding-left:38px}
.btn{background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;border:0;border-radius:12px;padding:13px;font:600 14px Inter,system-ui;width:100%;cursor:pointer;box-shadow:0 4px 12px #f26a0f40}
.btn.s{width:auto;padding:6px 12px;font-size:12px}.btn.l{background:var(--card);color:var(--o);border:1px solid var(--o);box-shadow:none}.btn.d{background:var(--rd);box-shadow:none}.btn.ok{background:var(--ok);box-shadow:none}.btn.rl{background:var(--card);color:var(--rd);border:1px solid var(--rd);box-shadow:none}
.btn.row{justify-content:center}.btn:disabled{opacity:.5}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:99px;font:600 12px Inter,system-ui;white-space:nowrap;cursor:pointer}.tabs .on{background:var(--o);color:#fff;border-color:var(--o)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;box-shadow:0 -4px 16px #0000000f;display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);font:500 11px Inter,system-ui;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}nav .on{color:var(--o);font-weight:700}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.splash{min-height:100vh;background:linear-gradient(160deg,var(--o),var(--o2));color:#fff;text-align:center;padding:70px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}.splash p{margin:0}.splash .btn{background:#fff;color:var(--o);max-width:280px;margin-top:20px;box-shadow:none}
.login{padding:40px 20px;text-align:center}.logo{font-size:56px}.login h1{color:var(--o);margin:6px 0}
.lg{height:84px;width:auto;filter:drop-shadow(0 4px 8px #0003)}.splash .lg{height:150px;animation:pop .7s ease both;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 2px #fff) drop-shadow(0 8px 16px #0005)}@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
.tl{border-left:2px solid var(--bd);margin-left:6px;padding-left:12px}.tl div{margin-bottom:8px}.tl .d{color:var(--ok);font-weight:600}
.stat,.card[onclick],.mi{cursor:pointer}button,.card{-webkit-tap-highlight-color:transparent}.btn:active,.card[onclick]:active,.stat:active{opacity:.8}
.warn{background:var(--ylb);color:var(--yl);border-color:transparent}
.em{text-align:center;padding:24px 8px}.em svg{width:170px;height:150px}.em b{display:block;margin-top:8px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;border-top:1px solid var(--bd);margin-top:12px;padding-top:12px;font-size:11px;color:var(--mu)}.st3 svg{color:var(--mu)}.st3 b{display:block;color:var(--tx);font-size:13px;margin-top:2px}
.menu .mi{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--bd)}.menu .mi:last-child{border:0}.menu .mi svg{color:var(--mu)}
.sw{width:46px;height:26px;border-radius:99px;background:#d9cfc6;position:relative;flex:none;cursor:pointer;transition:.2s}.sw.on{background:var(--o)}.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw.on:after{left:23px}
.pv{width:64px;height:64px;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:0 7px 7px;flex:none;border:1px solid var(--bd)}.pv i{display:block;height:15px;margin:0 -7px 2px;background:var(--o)}.pv b{height:6px;border-radius:3px;display:block}.pv.light{background:#fff7f0}.pv.light b{background:#f3e0d0}.pv.dark{background:#17110d}.pv.dark b{background:#3a2c20}
.rb{width:22px;height:22px;border-radius:50%;border:2px solid var(--o);flex:none}.rb.on{background:radial-gradient(var(--o) 0 45%,transparent 50%)}
.bar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}.bar span{width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar i{display:block;height:10px;border-radius:6px;background:var(--o);min-width:4px}
.cols{display:flex;gap:10px;align-items:flex-end;margin-top:10px}.cols div{flex:1;text-align:center;font-size:11px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px}.cols i{display:block;width:100%;background:var(--o);border-radius:6px 6px 0 0;min-height:3px}
.kop{display:none;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}.kop .lg{height:56px;filter:none}
.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.ql{text-align:center;border:1px dashed var(--bd);border-radius:10px;padding:8px;font-size:11px;break-inside:avoid}.ql svg{width:100%;max-width:130px}

.brand{display:none}
@media (min-width:900px){
#app.in{max-width:none;margin:0;padding:0 0 24px 250px}
#app.in nav{left:0;top:0;bottom:0;transform:none;width:250px;max-width:none;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 14px;border-radius:0;border-top:0;border-right:1px solid var(--bd);box-shadow:none;overflow:auto}
nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}nav .brand .lg{height:46px;filter:none}nav .brand b{display:block;font-size:17px;color:var(--o)}nav .brand small{color:var(--mu);font-size:11px}

.top{padding:22px 32px 26px;border-radius:0 0 24px 24px}.top h2{font-size:22px}.pad{padding:24px 32px;max-width:1180px}
.pg-home .pad,.pg-alat .pad,.pg-pinjam .pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.pg-home .pad>*,.pg-alat .pad>*,.pg-pinjam .pad>*{margin:0}
.pg-home .pad>:not(.card),.pg-alat .pad>:not(.card),.pg-pinjam .pad>:not(.card),.pg-home .pad>.warn,.pg-home .pad>.tbl,.pg-home .pad>.em,.pg-alat .pad>.em,.pg-pinjam .pad>.em{grid-column:1/-1}
.pg-home .grid,.pg-laporan .grid{grid-template-columns:repeat(4,1fr)}
.pg-home .pad>.btn,.pg-alat .pad>.btn,.pg-pinjam .pad>.btn{max-width:360px}
.pg-detail .pad{max-width:760px}.pg-form .pad,.pg-profil .pad,.pg-notifset .pad,.pg-tema .pad,.pg-users .pad{max-width:640px}
.modal{align-items:center}.sheet{border-radius:20px;max-height:86vh}
}
@media print{#app.in{padding:0}}
@media print{nav,.top .btn,.top .ib,.noprint{display:none!important}}

async function actF(id,a){const{runTransaction:T,doc}=F.m,lr=doc(F.db,'loans',String(id));
 await T(F.db,async tx=>{const ls=await tx.get(lr);if(!ls.exists())throw new Error('Pengajuan tidak ditemukan.');const l=ls.data();if(l.st!=='Menunggu')throw new Error('Pengajuan ini sudah diproses.');
  const tr=doc(F.db,'tools',String(l.alat)),ts=await tx.get(tr);
  if(a==='setuju'){if(!ts.exists()||ts.data().stok<l.jml)throw new Error('Stok tidak cukup.');tx.update(tr,{stok:ts.data().stok-l.jml});tx.update(lr,{st:'Dipinjam',log:[...(l.log||[]),{t:iso(TD),m:'Disetujui & alat diserahkan'}]})}
  else tx.update(lr,{st:'Ditolak',log:[...(l.log||[]),{t:iso(TD),m:'Ditolak'}]})})}
async function retF(id,k,cat,foto){const{runTransaction:T,doc}=F.m,lr=doc(F.db,'loans',String(id));
 await T(F.db,async tx=>{const ls=await tx.get(lr);if(!ls.exists())throw new Error('Data tidak ditemukan.');const l=ls.data();if(l.st!=='Dipinjam')throw new Error('Alat ini sudah dikembalikan.');
  const tr=doc(F.db,'tools',String(l.alat)),ts=await tx.get(tr);
  if(ts.exists()){const t=ts.data();if(k==='Baik')tx.update(tr,{stok:t.stok+l.jml});else if(k==='Hilang')tx.update(tr,{total:Math.max(0,t.total-l.jml)})}
  tx.update(lr,{st:'Selesai',kondisi:k,...(foto?{foto}:{}),log:[...(l.log||[]),{t:iso(TD),m:'Dikembalikan ('+k+')'+(cat?' – '+cat:'')}]})})}

const loanAct=l=>{const A=adm(),x=l.ext;
 if(A&&l.st==='Menunggu')return `<div class="row" style="margin-top:8px"><button class="btn d s sp" onclick="act(${l.id},'tolak')">Tolak</button><button class="btn ok s sp" onclick="act(${l.id},'setuju')">Setujui</button></div>`;
 if(A&&l.st==='Dipinjam')return (x&&x.st==='Menunggu'?`<div class="card warn" style="margin:8px 0 0">Minta perpanjangan sampai ${fmt(x.req)}<div class="row" style="margin-top:6px"><button class="btn d s sp" onclick="extAct(${l.id},0)">Tolak</button><button class="btn ok s sp" onclick="extAct(${l.id},1)">Setujui</button></div></div>`:'')+`<button class="btn s" style="margin-top:8px" onclick="ret(${l.id})">Terima Pengembalian</button>`;
 if(!A&&l.st==='Menunggu')return `<button class="btn l s" style="margin-top:8px" onclick="cancelLoan(${l.id})">Batalkan Pengajuan</button>`;
 if(!A&&st(l)==='Dipinjam')return x&&x.st==='Menunggu'?`<div class="mu" style="margin-top:8px">Perpanjangan diminta sampai ${fmt(x.req)}, menunggu persetujuan.</div>`:`<button class="btn l s" style="margin-top:8px" onclick="extForm(${l.id})">Ajukan Perpanjangan</button>`;
 return ''};
const dmg=t=>{const L=D.loans.filter(l=>l.alat==t.id&&(l.kondisi==='Rusak'||l.kondisi==='Hilang'));return L.length?`<div class="card"><b>Riwayat Kerusakan</b>${L.map(l=>`<div class="row" style="margin-top:8px">${l.foto?`<img src="${l.foto}" style="width:44px;height:44px;border-radius:8px;object-fit:cover" alt="">`:''}<div class="sp"><span>${E(l.user)}</span><div class="mu">${fmt(l.log[l.log.length-1][0])} • ×${l.jml}</div></div><span class="tag r">${l.kondisi}</span></div>`).join('')}</div>`:''};
const charts=()=>{const c={},m={},late={};D.loans.forEach(l=>{c[l.alat]=(c[l.alat]||0)+l.jml;const k=l.tgl.slice(0,7);m[k]=(m[k]||0)+1;if(st(l)==='Terlambat')late[l.user]=(late[l.user]||0)+1});
 const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=Math.max(1,...top.map(x=>x[1])),ms=[];for(let i=5;i>=0;i--){const d=new Date(TD);d.setDate(1);d.setMonth(d.getMonth()-i);ms.push(iso(d).slice(0,7))}
 const mm=Math.max(1,...ms.map(k=>m[k]||0)),lt=Object.entries(late).sort((a,b)=>b[1]-a[1]).slice(0,5);
 return `<div class="card"><b>Alat Paling Sering Dipinjam</b>${top.map(x=>`<div class="bar"><span>${E(tool(x[0]).nama)}</span><i style="width:${x[1]/mx*60}%"></i><b>${x[1]}</b></div>`).join('')||'<p class="mu">Belum ada data.</p>'}</div>
 <div class="card"><b>Peminjaman 6 Bulan Terakhir</b><div class="cols">${ms.map(k=>`<div><b>${m[k]||0}</b><i style="height:${(m[k]||0)/mm*80}px"></i><span>${k.slice(5)}</span></div>`).join('')}</div></div>
 ${lt.length?`<div class="card"><b>Sering Terlambat</b>${lt.map(x=>`<div class="row" style="margin-top:8px"><span class="sp">${E(x[0])}</span><span class="tag r">${x[1]}×</span></div>`).join('')}</div>`:''}`};
function extForm(id){const l=D.loans.find(x=>x.id===id),mx=iso(new Date(new Date(l.kem+'T00:00').getTime()+MAX_HARI*864e5));
 modal(`<h3 style="margin-top:0">Ajukan Perpanjangan</h3><p class="mu">Jatuh tempo saat ini ${fmt(l.kem)}. Perpanjangan maksimal sampai ${fmt(mx)}.</p><label>Kembali sampai tanggal</label><input id="xd" type="date" min="${l.kem}" max="${mx}" value="${l.kem}"><button class="btn" onclick="reqExt(${id},'${mx}')">Kirim Permintaan</button>`)}
function reqExt(id,mx){const l=D.loans.find(x=>x.id===id),d=$('#xd').value;if(!d||d<=l.kem||d>mx)return alert('Pilih tanggal setelah jatuh tempo, maksimal '+fmt(mx)+'.');
 l.ext={req:d,st:'Menunggu'};l.log.push([iso(TD),'Meminta perpanjangan sampai '+fmt(d)]);save();modal();render()}
function extAct(id,ok){const l=D.loans.find(x=>x.id===id);if(!l||!l.ext)return;
 if(ok){l.kem=l.ext.req;l.ext={req:l.ext.req,st:'Disetujui'};l.log.push([iso(TD),'Perpanjangan disetujui sampai '+fmt(l.kem)])}else{l.ext={req:l.ext.req,st:'Ditolak'};l.log.push([iso(TD),'Perpanjangan ditolak'])}
 save();modal();render()}
const qrBox=t=>`<div class="ql"><div style="width:130px;margin:0 auto">${window.qrSvg('CISATLAB:'+t.kode)}</div><b>${E(t.nama)}</b><div class="mu">${E(t.kode)}</div></div>`;
function qrLabel(id){const t=tool(id);modal(`<h3 style="margin-top:0">Label QR Alat</h3><div class="qg" style="grid-template-columns:1fr;max-width:220px;margin:auto">${qrBox(t)}</div><br><button class="btn noprint" onclick="printQ()">Cetak Label</button>`)}
function qrAll(){modal(`<h3 style="margin-top:0">Label QR Semua Alat</h3><div class="qg">${D.tools.map(qrBox).join('')}</div><br><button class="btn noprint" onclick="printQ()">Cetak Semua Label</button>`)}
function printQ(){document.body.classList.add('pq');print();setTimeout(()=>document.body.classList.remove('pq'),600)}
function stopScan(){if(SC){SC.getTracks().forEach(t=>t.stop());SC=null}}
function manualCode(msg){modal(`<h3 style="margin-top:0">Masukkan Kode Alat</h3>${msg?`<p class="mu">${msg}</p>`:''}<label>Kode alat</label><input id="qc" placeholder="contoh: LAB-001"><button class="btn" onclick="qrFound($('#qc').value)">Cari Alat</button>`)}
async function scanQR(){if(!window.BarcodeDetector||!navigator.mediaDevices)return manualCode('Perangkat ini belum mendukung scan kamera. Masukkan kode alat secara manual.');
 modal(`<h3 style="margin-top:0">Scan QR Alat</h3><video id="sv" playsinline muted style="width:100%;border-radius:14px;background:#000"></video><p class="mu">Arahkan kamera ke QR pada label alat.</p><button class="btn l" onclick="manualCode()">Masukkan kode manual</button>`);
 try{const m=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#sv'),bd=new BarcodeDetector({formats:['qr_code']});if(!v){m.getTracks().forEach(t=>t.stop());return}v.srcObject=m;await v.play();SC=m;
  const loop=async()=>{if(!SC)return;try{const r=await bd.detect(v);if(r.length){stopScan();return qrFound(r[0].rawValue)}}catch(e){}setTimeout(loop,300)};loop()}catch(e){stopScan();manualCode('Kamera tidak bisa dibuka. Masukkan kode alat secara manual.')}}
function qrFound(raw){const k=String(raw||'').replace(/^CISATLAB:/i,'').trim().toUpperCase(),t=D.tools.find(x=>String(x.kode||'').toUpperCase()===k);
 if(!t){modal();return alert('Alat dengan kode "'+k+'" tidak ditemukan.')}
 if(!adm()){modal();return detail(t.id)}
 const L=D.loans.filter(l=>l.alat==t.id&&['Menunggu','Dipinjam'].includes(l.st));
 modal(`<h3 style="margin-top:0">${E(t.nama)} <span class="tag n">${E(t.kode)}</span></h3><p class="mu">Stok tersedia: ${t.stok} dari ${t.total}</p>${L.length?L.map(l=>loanRow(l,loanAct(l))).join(''):'<p class="mu">Tidak ada pengajuan atau peminjaman aktif untuk alat ini.</p>'}<button class="btn l" onclick="modal();detail(${t.id})">Lihat Detail Alat</button>`)}
const devBtn=()=>window.Notification?`<button class="btn l row" style="margin-top:12px" onclick="askNotif()">${ic('bell',18)} ${Notification.permission==='granted'?'Notifikasi perangkat aktif':'Izinkan notifikasi perangkat'}</button><p class="mu">Pengingat muncul saat aplikasi dibuka. Pengiriman otomatis saat aplikasi tertutup memerlukan server tambahan.</p>`:'';
function askNotif(){Notification.requestPermission().then(()=>render())}
function deviceNotify(){if(!U||!NT()||!window.Notification||Notification.permission!=='granted')return;
 const L=mine().filter(l=>st(l)==='Terlambat'||(st(l)==='Dipinjam'&&l.kem<=day(1))).length,P=adm()?D.loans.filter(l=>l.st==='Menunggu').length:0;
 const body=(P?P+' pengajuan menunggu persetujuan. ':'')+(L?L+' pinjaman jatuh tempo atau terlambat.':'');if(!body)return;
 const o={body,icon:'icon-192.png',badge:'icon-192.png'};try{navigator.serviceWorker.ready.then(r=>r.showNotification('Cisat Lab',o))}catch(e){try{new Notification('Cisat Lab',o)}catch(x){}}}
if(FB)fbInit().catch(e=>alert('Firebase gagal dimuat: '+e.message));
document.documentElement.dataset.theme=TM();
render();
</script></body></html>
