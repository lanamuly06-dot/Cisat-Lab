function shrink(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,300/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.75))};i.src=URL.createObjectURL(f)})}
function detail(id){openPage('detail',id)}
function openForm(id){if(!D.tools.some(t=>t.stok>0))return alert('Belum ada alat yang tersedia untuk dipinjam.');openPage('form',id)}
function submitLoan(){
 const a=+$('#fa').value,j=+$('#fj').value,t=$('#ft').value,k=$('#fk').value,T=tool(a);
 if(!T.id)return alert('Pilih alat terlebih dahulu.');if(!(j>=1)||j>T.stok)return alert('Jumlah melebihi stok tersedia ('+T.stok+').');
 if(!t||!k||k<t)return alert('Tanggal kembali harus sama atau setelah tanggal pinjam.');
 D.loans.push({id:Date.now(),user:U.nama,uid:U.uid,kelas:U.kelas,alat:a,jml:j,tgl:t,kem:k,tuj:$('#fc').value.trim()||'-',cat:'',st:'Menunggu',log:[[iso(TD),'Permohonan diajukan']]});

function ld(id){const l=D.loans.find(x=>x.id===id),t=tool(l.alat);
 modal(`<div class="row"><div class="ico">${pic(t)}</div><div class="sp"><b>${E(t.nama)}</b><div class="mu">${t.kode}</div></div>${tg(l)}</div>
 <h3>Informasi Peminjaman</h3><div class="card">${[['Peminjam',l.user+' ('+l.kelas+')'],['Jumlah',l.jml],['Tanggal Pinjam',fmt(l.tgl)],['Tanggal Kembali',fmt(l.kem)],['Keperluan',l.tuj],['Catatan',l.cat||'-'],...(st(l)==='Terlambat'?[['Terlambat',lateDays(l)+' hari']]:[])].map(r=>`<div class="row"><span class="mu sp">${r[0]}</span><span>${E(r[1])}</span></div>`).join('')}</div>
 <h3>Riwayat Status</h3><div class="tl">${l.log.map(x=>`<div class="d">${E(x[1])}<div class="mu">${fmt(x[0])}</div></div>`).join('')}</div>`)}
function act(id,a){const l=D.loans.find(x=>x.id===id),t=tool(l.alat);
 if(a==='setuju'){if(t.stok<l.jml)return alert('Stok tidak cukup.');t.stok-=l.jml;l.st='Dipinjam';l.log.push([iso(TD),'Disetujui & alat diserahkan'])}

function ret(id){const l=D.loans.find(x=>x.id===id);
 modal(`<h3 style="margin-top:0">Pengembalian Alat</h3><p>${tool(l.alat).nama} ×${l.jml} — ${E(l.user)}</p><label>Kondisi Alat</label><select id="rk"><option>Baik</option><option>Rusak</option><option>Hilang</option></select><label>Catatan</label><textarea id="rc" rows="2"></textarea><button class="btn" onclick="doRet(${id})">Simpan</button>`)}
function doRet(id){const l=D.loans.find(x=>x.id===id),t=tool(l.alat),k=$('#rk').value;
 if(k==='Baik')t.stok+=l.jml;else if(k==='Hilang')t.total=Math.max(0,t.total-l.jml);
 l.st='Selesai';l.log.push([iso(TD),'Dikembalikan ('+k+')'+($('#rc').value?' – '+$('#rc').value:'')]);save();modal();render()}
function toolForm(id){const t=id?tool(id):{nama:'',kat:'Biologi',ic:'alat',stok:1,total:1,kon:'Baik',lok:'',desc:'',kode:''};
 modal(`<h3 style="margin-top:0">${id?'Edit':'Tambah'} Alat</h3><label>Nama</label><input id="tn" value="${E(t.nama)}"><label>Kategori</label><input id="tk" value="${E(t.kat)}"><label>Total Stok</label><input id="ts" type="number" min="0" value="${t.total}"><label>Lokasi</label><input id="tl" value="${E(t.lok)}"><label>Kondisi</label><select id="tc">${['Baik','Rusak ringan','Rusak'].map(o=>`<option ${o===t.kon?'selected':''}>${o}</option>`).join('')}</select><label>Deskripsi</label><textarea id="td" rows="2">${E(t.desc)}</textarea><label>Spesifikasi (satu per baris, contoh: Merk: Nikon)</label><textarea id="tx" rows="3">${E(t.spek||'')}</textarea><label>Foto Alat (opsional)</label><input id="tf" type="file" accept="image/*"><button class="btn" onclick="saveTool(${id||0})">Simpan</button>`)}
async function saveTool(id){const n=$('#tn').value.trim();if(!n)return alert('Nama alat wajib diisi.');const f=$('#tf').files[0];
 const tot=+$('#ts').value,v={nama:n,kat:$('#tk').value||'Umum',total:tot,lok:$('#tl').value,kon:$('#tc').value,desc:$('#td').value,spek:$('#tx').value};if(f)v.img=await shrink(f);
 if(id){const t=tool(id);t.stok=Math.max(0,t.stok+tot-t.total);Object.assign(t,v)}
 else{const i=Date.now();D.tools.push({id:i,kode:'LAB-'+String(D.tools.length+1).padStart(3,'0'),ic:'alat',stok:tot,...v})}
 save();modal();render()}
function delTool(id){if(confirm('Hapus alat ini?')){D.tools=D.tools.filter(t=>t.id!==id);save();modal();tab='alat';render();scrollTo(0,0)}}

function reg(){modal(`<h3 style="margin-top:0">Daftar Akun Siswa</h3><label>Nama Lengkap</label><input id="rn"><label>Kelas</label><input id="rk" placeholder="X IPA 1"><label>Email</label><input id="re" type="email"><label>Password (min. 6 karakter)</label><input id="rp" type="password"><button class="btn" onclick="doReg()">Daftar</button>`)}
async function doReg(){F.hold=new Promise(r=>F.rel=r);try{const c=await F.a.createUserWithEmailAndPassword(F.auth,$('#re').value.trim(),$('#rp').value),p={nama:$('#rn').value.trim()||$('#re').value,kelas:$('#rk').value.trim(),role:'siswa'};await F.m.setDoc(F.m.doc(F.db,'users',c.user.uid),p);modal()}catch(e){alert('Gagal daftar: '+e.code)}F.rel();F.hold=0}
async function sync(){const{setDoc,deleteDoc,doc}=F.m;for(const c of['tools','loans']){const cur={};D[c].forEach(x=>cur[x.id]=JSON.stringify(x));
 for(const i in cur)if(SNAP[c][i]!==cur[i]){SNAP[c][i]=cur[i];setDoc(doc(F.db,c,i),enc(JSON.parse(cur[i]))).catch(e=>alert('Gagal menyimpan: '+e.code))}
 for(const i in SNAP[c])if(!(i in cur)){delete SNAP[c][i];deleteDoc(doc(F.db,c,i)).catch(()=>{})}}}
async function fbInit(){const B='https://www.gstatic.com/firebasejs/10.12.2/',[a,au,fs]=await Promise.all(['app','auth','firestore'].map(n=>import(B+'firebase-'+n+'.js')));
 const app=a.initializeApp(FB);F={a:au,m:fs,auth:au.getAuth(app),db:fs.getFirestore(app),un:[]};
 au.onAuthStateChanged(F.auth,async u=>{F.un.forEach(f=>f());F.un=[];if(!u){U=null;D={tools:[],loans:[],users:[]};render();return}
  await F.hold;let p={nama:u.email,kelas:'',role:'siswa'};try{const s=await fs.getDoc(fs.doc(F.db,'users',u.uid));if(s.exists())p=s.data();else fs.setDoc(fs.doc(F.db,'users',u.uid),p).catch(()=>{})}catch(e){alert('Gagal membaca profil ('+e.code+'). Pastikan Firestore Rules sudah di-Publish.')}
  U={uid:u.uid,nama:p.nama,kelas:p.kelas||'',role:p.role};splash=0;tab='home';listen();render()})}
function listen(){const{collection:C,query:Q,where:W,onSnapshot:O}=F.m;
 F.un=['tools','loans'].map(c=>{const r=C(F.db,c);return O(adm()||c==='tools'?r:Q(r,W('uid','==',U.uid)),s=>{D[c]=s.docs.map(d=>dec(d.data())).sort((x,y)=>x.id-y.id);SNAP[c]={};D[c].forEach(x=>SNAP[c][x.id]=JSON.stringify(x));if(tab!=='form')render()},e=>alert('Gagal memuat data ('+e.code+'). Cek Firestore Rules.'))});if(adm())F.un.push(O(C(F.db,'users'),s=>{D.users=s.docs.map(d=>({...d.data(),id:d.id}));if(tab!=='form')render()},e=>console.warn(e)))}
const NS=()=>{try{return JSON.parse(localStorage.getItem('cisat_ns'))||{}}catch(e){return{}}};
const NK=[['setuju','Peminjaman Disetujui'],['kembali','Pengembalian Alat'],['ingat','Pengingat Pengembalian'],['habis','Alat Hampir Habis'],['info','Informasi dan Pengumuman']];
const NT=()=>NS().on!==false;
function tog(k){const s=NS();s[k]=s[k]===false;try{localStorage.setItem('cisat_ns',JSON.stringify(s))}catch(e){}render()}
function notes(){const o=[],P=NS(),on=k=>P[k]!==false;mine().forEach(l=>{const t=tool(l.alat).nama,s=st(l);
 if(adm()){if(s==='Menunggu')o.push(['clock',l.user+' mengajukan '+t+' ×'+l.jml,l.id]);else if(s==='Terlambat'&&on('ingat'))o.push(['warn',l.user+' terlambat mengembalikan '+t,l.id])}
 else if(s==='Terlambat'){if(on('ingat'))o.push(['warn',t+' terlambat '+lateDays(l)+' hari, segera kembalikan',l.id])}
 else if(s==='Dipinjam'){if(on('setuju'))o.push(['check','Peminjaman '+t+' disetujui, kembali '+fmt(l.kem),l.id])}
 else if(s==='Menunggu')o.push(['clock','Pengajuan '+t+' menunggu persetujuan',l.id]);
 else if(s==='Ditolak')o.push(['cancel','Pengajuan '+t+' ditolak',l.id])});
 if(adm()&&on('habis'))D.tools.filter(t=>t.stok<=2).forEach(t=>o.push(['alat','Stok '+t.nama+' hampir habis ('+t.stok+')',0]));return o}
function notif(){const o=notes();modal(`<h3 style="margin-top:0">Notifikasi</h3>${NT()?(o.map(n=>`<div class="card row" onclick="${n[2]?'ld('+n[2]+')':'modal()'}"><span style="color:var(--o)">${ic(n[0],22)}</span><span class="sp">${E(n[1])}</span>${ic('right',18)}</div>`).join('')||'<p class="mu">Tidak ada notifikasi.</p>'):'<p class="mu">Notifikasi dimatikan. Aktifkan di Profil → Notifikasi.</p>'}`)}
function acct(){modal(`<h3 style="margin-top:0">Informasi Akun</h3><label>Nama</label><input id="an" value="${E(U.nama)}"><label>Kelas / Jabatan</label><input id="ak" value="${E(U.kelas)}"><button class="btn" onclick="saveAcct()">Simpan</button>`)}
async function saveAcct(){const n=$('#an').value.trim(),k=$('#ak').value.trim();if(!n)return alert('Nama wajib diisi.');U.nama=n;U.kelas=k;
 if(F)try{await F.m.setDoc(F.m.doc(F.db,'users',U.uid),{nama:n,kelas:k,role:U.role})}catch(e){alert('Gagal menyimpan: '+e.code)}
 modal();render()}
function help(){modal(`<h3 style="margin-top:0">Bantuan</h3><div class="card"><b>Cara meminjam</b><div class="mu">1. Buka tab Alat atau tombol Ajukan Peminjaman.<br>2. Pilih alat, jumlah, dan tanggal.<br>3. Tunggu persetujuan petugas lab.<br>4. Ambil alat, lalu kembalikan sesuai tanggal.</div></div><div class="card"><b>Status</b><div class="mu">Menunggu → Dipinjam → Selesai. Pengajuan yang masih Menunggu bisa dibatalkan.</div></div><div class="card"><b>Kontak</b><div class="mu">Hubungi petugas laboratorium ${SCHOOL}.</div></div>`)}
function cancelLoan(id){if(confirm('Batalkan pengajuan ini?')){D.loans=D.loans.filter(x=>x.id!==id);save();render()}}
function setRole(id,role){if(id===U.uid)return alert('Peran akunmu sendiri tidak bisa diubah.');
 if(F)F.m.updateDoc(F.m.doc(F.db,'users',id),{role}).catch(e=>alert('Gagal: '+e.code));else{const u=D.users.find(x=>x.id===id);if(u)u.role=role;save();render()}}
function resetDemo(){if(confirm('Reset semua data ke contoh awal?')){D=fresh();save();render()}}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"',t=[['Tanggal Pinjam','Tanggal Kembali','Peminjam','Kelas','Alat','Jumlah','Tujuan','Status'],...D.loans.map(l=>[l.tgl,l.kem,l.user,l.kelas,tool(l.alat).nama,l.jml,l.tuj,st(l)])].map(r=>r.map(q).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='laporan-cisat-lab.csv';document.body.appendChild(a);a.click();a.remove()}
let IP=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;if(U)render()});
function installApp(){if(IP){IP.prompt();IP=null;render()}}
addEventListener('load',()=>{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{})});
if(FB)fbInit().catch(e=>alert('Firebase gagal dimuat: '+e.message));
document.documentElement.dataset.theme=TM();
render();
